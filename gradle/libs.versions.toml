[versions]
# Build tooling
agp = "9.4.0"
kotlin = "2.4.10"
ksp = "2.3.11"
refine = "4.4.0"

# SDK levels
compileSdk = "37"
minSdk = "27"
targetSdk = "36"

# AndroidX
appcompat = "1.8.0"
constraintlayout = "2.2.2"
coordinatorlayout = "1.3.0"
core-ktx = "1.19.0"
lifecycle = "2.11.0"
preference = "1.2.1"
room = "2.8.4"
viewpager2 = "1.1.0"
window = "1.5.1"

# Others
coroutines = "1.11.0"
espresso = "3.7.0"
fastkv = "3.0.1"
hiddenapibypass = "6.1"
junit = "4.13.2"
junit-ext = "1.3.0"
material = "1.14.0"
material-preference = "2.0.0"
okhttp = "5.5.0"
packable = "2.1.3"
permissionx = "1.8.1"
shizuku = "13.1.5"
# de.robv.android.xposed:api is unmaintained; 82 is the final published release.
xposed = "82"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }

fastkv = { module = "io.github.billywei01:fastkv", version.ref = "fastkv" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
material = { module = "com.google.android.material:material", version.ref = "material" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
packable-kotlin = { module = "io.github.billywei01:packable-kotlin", version.ref = "packable" }
permissionx = { module = "com.guolindev.permissionx:permissionx", version.ref = "permissionx" }
rikka-material-preference = { module = "dev.rikka.rikkax.material:material-preference", version.ref = "material-preference" }
rikka-refine-annotation = { module = "dev.rikka.tools.refine:annotation", version.ref = "refine" }
rikka-refine-annotation-processor = { module = "dev.rikka.tools.refine:annotation-processor", version.ref = "refine" }
rikka-refine-runtime = { module = "dev.rikka.tools.refine:runtime", version.ref = "refine" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
xposed-api = { module = "de.robv.android.xposed:api", version.ref = "xposed" }

# Referenced from the root buildscript classpath so that AGP's built-in Kotlin
# uses this KGP version instead of the one AGP ships with by default.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Test
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junit-ext" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
rikka-refine = { id = "dev.rikka.tools.refine", version.ref = "refine" }
