# Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with
# the Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true

# Each library's R class only includes the resources declared in the library
# itself, which keeps the generated R classes small.
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
